<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Árvore das Nossas Memórias</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <span class="eyebrow">Uma história em fotografias</span>
    <h1>Árvore das Nossas Memórias</h1>
    <p>Cada folha guarda um instante. Toque em um quadro para reviver a lembrança.</p>
  </header>

  <main class="hero-scene">

    <!-- ===================================================================
       CAMADA DA ÁRVORE (decorativa, não recebe cliques)
       =================================================================== -->
    <div class="tree-layer" id="tree-layer">

      <svg class="tree-svg" viewBox="0 0 900 1200" preserveAspectRatio="xMinYMax meet" aria-hidden="true">
        <defs>
          <linearGradient id="trunkGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#8d7550" />
            <stop offset="45%" stop-color="#d9c9a3" />
            <stop offset="100%" stop-color="#a68d61" />
          </linearGradient>
          <radialGradient id="leafGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#5a8f6a" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#1c3626" stop-opacity="0.0" />
          </radialGradient>
        </defs>

        <!-- TRONCO E GALHOS PRINCIPAIS -->
        <g fill="none" stroke="url(#trunkGradient)" stroke-linecap="round">
          <path d="M 150 1200 C 140 1030 170 940 210 860" stroke-width="34" />
          <path d="M 210 860 C 250 760 190 690 230 600" stroke-width="24" />
          <path d="M 210 860 C 190 770 300 730 340 650" stroke-width="20" />
          <!-- galho superior esquerdo -->
          <path d="M 230 600 C 210 520 260 470 240 390" stroke-width="13" />
          <path d="M 230 600 C 280 540 340 560 400 500" stroke-width="12" />
          <!-- galho superior direito, estende para a área dos quadros -->
          <path d="M 340 650 C 420 610 480 640 560 580" stroke-width="14" />
          <path d="M 340 650 C 380 580 350 500 420 440" stroke-width="11" />
          <path d="M 560 580 C 630 540 680 560 760 510" stroke-width="9" />
          <path d="M 420 440 C 460 380 430 320 480 260" stroke-width="8" />
          <path d="M 240 390 C 230 320 270 280 250 210" stroke-width="7" />
          <path d="M 400 500 C 440 450 500 460 540 410" stroke-width="8" />
          <path d="M 480 260 C 510 220 560 210 590 170" stroke-width="5" />
          <path d="M 250 210 C 245 160 280 140 270 90" stroke-width="4" />
        </g>

        <!-- COPA — aglomerados de folhas (círculos sobrepostos, efeito pintado) -->
        <g class="foliage">
          <g class="leaf-cluster" style="animation-delay:-0.5s">
            <circle cx="230" cy="360" r="95" fill="var(--leaf-deep)" opacity="0.55" />
            <circle cx="190" cy="330" r="70" fill="var(--leaf-mid)" opacity="0.6" />
            <circle cx="270" cy="310" r="60" fill="var(--leaf-light)" opacity="0.5" />
          </g>
          <g class="leaf-cluster" style="animation-delay:-2s">
            <circle cx="420" cy="410" r="100" fill="var(--leaf-deep)" opacity="0.55" />
            <circle cx="380" cy="380" r="72" fill="var(--leaf-mid)" opacity="0.6" />
            <circle cx="470" cy="360" r="55" fill="var(--leaf-light)" opacity="0.5" />
          </g>
          <g class="leaf-cluster" style="animation-delay:-3.4s">
            <circle cx="520" cy="330" r="80" fill="var(--leaf-deep)" opacity="0.5" />
            <circle cx="560" cy="300" r="62" fill="var(--leaf-mid)" opacity="0.55" />
            <circle cx="500" cy="280" r="45" fill="var(--leaf-light)" opacity="0.5" />
          </g>
          <g class="leaf-cluster" style="animation-delay:-1.1s">
            <circle cx="300" cy="230" r="78" fill="var(--leaf-deep)" opacity="0.5" />
            <circle cx="330" cy="190" r="55" fill="var(--leaf-mid)" opacity="0.55" />
            <circle cx="260" cy="180" r="42" fill="var(--leaf-light)" opacity="0.5" />
          </g>
          <g class="leaf-cluster" style="animation-delay:-4.2s">
            <circle cx="620" cy="230" r="70" fill="var(--leaf-deep)" opacity="0.45" />
            <circle cx="650" cy="200" r="50" fill="var(--leaf-mid)" opacity="0.5" />
            <circle cx="590" cy="190" r="38" fill="var(--leaf-light)" opacity="0.45" />
          </g>
          <g class="leaf-cluster" style="animation-delay:-2.8s">
            <circle cx="130" cy="470" r="72" fill="var(--leaf-deep)" opacity="0.45" />
            <circle cx="160" cy="440" r="50" fill="var(--leaf-mid)" opacity="0.5" />
          </g>
        </g>

        <!-- FLORES -->
        <g fill="var(--blossom)">
          <g class="blossom" style="animation-delay:-0.8s">
            <circle cx="205" cy="340" r="5" />
          </g>
          <g class="blossom" style="animation-delay:-2.1s">
            <circle cx="255" cy="300" r="4.5" />
          </g>
          <g class="blossom" style="animation-delay:-1.4s">
            <circle cx="410" cy="370" r="5" />
          </g>
          <g class="blossom" style="animation-delay:-3.2s">
            <circle cx="460" cy="330" r="4" />
          </g>
          <g class="blossom" style="animation-delay:-0.3s">
            <circle cx="540" cy="300" r="4.5" />
          </g>
          <g class="blossom" style="animation-delay:-2.6s">
            <circle cx="320" cy="210" r="4" />
          </g>
          <g class="blossom" style="animation-delay:-1.8s">
            <circle cx="600" cy="220" r="4" />
          </g>
          <g class="blossom" style="animation-delay:-3.6s">
            <circle cx="150" cy="440" r="4" />
          </g>
          <g class="blossom" style="animation-delay:-0.6s" fill="var(--blossom-light)">
            <circle cx="290" cy="260" r="3.5" />
          </g>
          <g class="blossom" style="animation-delay:-2.9s" fill="var(--blossom-light)">
            <circle cx="480" cy="290" r="3.5" />
          </g>
        </g>
      </svg>

      <!-- pássaros atravessando o céu lentamente -->
      <svg class="bird bird-1" viewBox="0 0 32 16">
        <path d="M0 8 Q8 0 16 8 Q24 0 32 8 Q24 4 16 10 Q8 4 0 8 Z" />
      </svg>
      <svg class="bird bird-2" viewBox="0 0 32 16">
        <path d="M0 8 Q8 0 16 8 Q24 0 32 8 Q24 4 16 10 Q8 4 0 8 Z" />
      </svg>
      <svg class="bird bird-3" viewBox="0 0 32 16">
        <path d="M0 8 Q8 0 16 8 Q24 0 32 8 Q24 4 16 10 Q8 4 0 8 Z" />
      </svg>
    </div>

    <!-- ===================================================================
       CAMADA DOS QUADROS (gerada dinamicamente pelo script.js)
       =================================================================== -->
    <div class="memories-layer" id="memories-layer"></div>

  </main>

  <footer class="site-footer">
    feito com <span>&hearts;</span> para guardar o nosso tempo
  </footer>

  <!-- ===========================================================================
     MODAL — abre ao clicar em um quadro
     =========================================================================== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Fechar">&times;</button>
      <div class="modal-media" id="modal-media"></div>
      <span class="modal-date" id="modal-date"></span>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-message" id="modal-message"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
